name: Android APK

# Builds the app's debug APK and keeps it as a download on the run page.
# Release APKs are signed on the owner's machine (the key never leaves it).
on:
  push:
    branches: [main]
    paths: ['mobile/**', 'src/domain/**', '.github/workflows/android.yml']
  pull_request:
    paths: ['mobile/**', 'src/domain/**', '.github/workflows/android.yml']
  workflow_dispatch:

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            mobile/package-lock.json
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - run: npm ci
      - run: npm ci --prefix mobile
      - run: npm run --prefix mobile build
      - run: npx cap sync android
        working-directory: mobile
      - run: ./gradlew assembleDebug --no-daemon
        working-directory: mobile/android
      - uses: actions/upload-artifact@v4
        with:
          name: ppfp-debug-apk
          path: mobile/android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 14
